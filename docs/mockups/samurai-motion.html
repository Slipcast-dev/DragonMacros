.art{position:absolute;right:-115px;top:15px;width:390px;height:610px;pointer-events:none;opacity:.8}.sun{position:absolute;width:260px;height:260px;border-radius:50%;top:60px;left:90px;background:radial-gradient(circle at 36% 32%,#c54f3d,#852820 65%,#61231e);box-shadow:inset -28px -12px 55px #170c0a77,0 0 90px #ba382c0a;animation:sun-breathe 9s ease-in-out infinite}.sun:before{content:"";position:absolute;inset:0;border-radius:inherit;background:repeating-linear-gradient(176deg,transparent 0 5px,#0d12151a 5px 6px);mix-blend-mode:multiply}.orbit{position:absolute;left:58px;top:28px;width:324px;height:324px;border:1px solid #a8845133;border-radius:50%;transform:rotate(-25deg);animation:orbit 40s linear infinite}.orbit:after{content:"";position:absolute;left:12px;top:91px;width:4px;height:4px;background:#b38c59;border-radius:50%}.ink{position:absolute;top:256px;left:9px;width:390px;height:240px;filter:blur(.15px);overflow:visible}.ink path{stroke:#111314;stroke-width:25;fill:none;stroke-linecap:round;stroke-dasharray:600;stroke-dashoffset:600;animation:brush 2.2s var(--ease) .8s forwards}.ink path:nth-child(2){stroke-width:11;stroke:#1e2220;animation-delay:1.1s}.ink path:nth-child(3){stroke-width:2;stroke:#867354;opacity:.4;animation-delay:1.4s}.speck{position:absolute;width:2px;height:9px;background:#c77a555c;top:600px;left:var(--x);transform:rotate(-25deg);animation:drift var(--d) linear infinite;animation-delay:var(--delay)}.art-caption{position:absolute;top:470px;left:162px;font:50px/1.4 "Hiragino Mincho ProN","Yu Mincho",serif;color:#a08b694d;writing-mode:vertical-rl;letter-spacing:.2em}.art small{position:absolute;top:568px;left:142px;font-size:8px;letter-spacing:.18em;color:#777365;white-space:nowrap}.paused .status i{background:#b49a65}.paused .status{color:#b49a65}.paused .hint{color:#b49a65}.paused .hint:before{background:#b49a65}.replay .app{animation:none}.no-motion *,.no-motion *:before,.no-motion *:after{animation:none!important;transition:none!important}.no-motion .ink path{stroke-dashoffset:0}
@keyframes arrive{from{opacity:0;transform:translateY(20px) scale(.99)}to{opacity:1;transform:none}}@keyframes row-in{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}@keyframes editor-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@keyframes rail{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes brush{to{stroke-dashoffset:0}}@keyframes sun-breathe{0%,100%{transform:translateY(0);filter:saturate(.8)}50%{transform:translateY(-7px);filter:saturate(1.1)}}@keyframes orbit{to{transform:rotate(335deg)}}@keyframes drift{0%{opacity:0;transform:translateY(0) translateX(0) rotate(-25deg)}15%,75%{opacity:.6}100%{opacity:0;transform:translateY(-550px) translateX(-65px) rotate(100deg)}}@keyframes slash{to{transform:translateX(110%)}}@keyframes record-pulse{50%{box-shadow:0 0 0 4px #df493815}}

</style>

<script>
// Демонстрационные данные отделены от реального JSON-хранилища приложения.
const seed=[{name:'Браузер',key:['⌃','⌥','B'],kind:'url',target:'https://example.com',enabled:true,icon:'globe'},{name:'Почта',key:['⌃','⌥','M'],kind:'app',target:'/System/Applications/Mail.app',enabled:true,icon:'mail'},{name:'Терминал',key:['⌃','⌥','T'],kind:'app',target:'/System/Applications/Utilities/Terminal.app',enabled:true,icon:'terminal'},{name:'Рабочие ссылки',key:['⌃','⌥','W'],kind:'url',target:'https://example.com/work',enabled:true,icon:'link'}];
let macros=structuredClone(seed),selected=0,paused=false,recording=false,toastTimer;
const $=id=>document.getElementById(id),current=()=>macros[selected];
function icon(name){const s=document.createElementNS('http://www.w3.org/2000/svg','svg');const u=document.createElementNS(s.namespaceURI,'use');u.setAttribute('href','#'+name);s.append(u);return s;}
function rows(){const list=$('list');list.replaceChildren();macros.forEach((m,i)=>{const b=document.createElement('button');b.className='macro'+(i===selected?' selected':'');b.style.setProperty('--i',i);b.setAttribute('aria-pressed',String(i===selected));const title=document.createElement('span');title.className='row-title';title.append(icon(m.icon));const name=document.createElement('span');name.textContent=m.name||'Новый макрос';title.append(name);const key=document.createElement('span');key.className='key';key.textContent=m.key.join(' ')||'Без сочетания';b.append(title,key);b.onclick=()=>{if(i===selected)return;selected=i;recording=false;render(true)};list.append(b)});$('count').textContent=String(macros.length).padStart(2,'0');$('total').textContent=macros.length+' '+(macros.length===1?'макрос':'макроса');}
function refreshHint(){const m=current();$('hint').textContent=paused?'Макросы приостановлены':!m.enabled?'Макрос выключен':!m.key.length?'Комбинация не задана':'Комбинация активна';}
function render(animate=false){rows();const m=current();$('title').textContent=m.name||'Новый макрос';$('number').textContent=String(selected+1).padStart(2,'0');$('name').value=m.name;$('target').value=m.target;$('target-label').textContent=m.kind==='url'?'Адрес сайта':'Путь к приложению';$('subtitle').textContent=m.kind==='url'?'Открыть сайт по сочетанию клавиш':'Открыть приложение по сочетанию клавиш';$('kind-app').setAttribute('aria-selected',m.kind==='app');$('kind-url').setAttribute('aria-selected',m.kind==='url');document.querySelector('.segment').classList.toggle('app-kind',m.kind==='app');$('enabled').setAttribute('aria-checked',m.enabled);$('shortcut').classList.remove('recording');$('shortcut').replaceChildren();m.key.forEach(k=>{const el=document.createElement('kbd');el.textContent=k;$('shortcut').append(el)});if(!m.key.length){const span=document.createElement('span');span.className='shortcut-hint';span.textContent='Нажмите, чтобы задать';$('shortcut').append(span)}refreshHint();if(animate){const el=$('editor');el.classList.remove('change');void el.offsetWidth;el.classList.add('change')}}
function toast(message){clearTimeout(toastTimer);const t=document.querySelector('.toast');t.textContent=message;t.classList.add('visible');toastTimer=setTimeout(()=>t.classList.remove('visible'),2700)}
$('name').oninput=e=>{current().name=e.target.value;$('title').textContent=e.target.value||'Новый макрос';const name=$('list').children[selected].querySelector('.row-title span');name.textContent=e.target.value||'Новый макрос'};
$('target').oninput=e=>current().target=e.target.value;
for(const kind of ['app','url'])$('kind-'+kind).onclick=()=>{if(current().kind===kind)return;current().kind=kind;current().target=kind==='app'?'/Applications/Example.app':'https://example.com';render()};
$('enabled').onclick=()=>{current().enabled=!current().enabled;$('enabled').setAttribute('aria-checked',current().enabled);refreshHint()};
$('clear').onclick=()=>{current().key=[];recording=false;render()};
$('shortcut').onclick=()=>{recording=!recording;$('shortcut').classList.toggle('recording',recording);if(recording){$('shortcut').replaceChildren();const span=document.createElement('span');span.className='shortcut-hint';span.textContent='Нажмите сочетание… Esc — отмена';$('shortcut').append(span)}else render()};
window.addEventListener('keydown',e=>{if(!recording)return;e.preventDefault();if(e.key==='Escape'){recording=false;render();return}if(['Control','Alt','Shift','Meta'].includes(e.key))return;if(!e.ctrlKey&&!e.altKey&&!e.metaKey&&!/^F\d+$/.test(e.key)){toast('Добавьте Control, Option или Command');return}current().key=[...(e.ctrlKey?['⌃']:[]),...(e.altKey?['⌥']:[]),...(e.shiftKey?['⇧']:[]),...(e.metaKey?['⌘']:[]),e.key.toUpperCase()];recording=false;render()});
$('test').onclick=()=>{const btn=$('test');btn.querySelector('span').textContent='Выполняется…';btn.disabled=true;setTimeout(()=>{btn.querySelector('span').textContent='Проверить';btn.disabled=false;toast('Демонстрация: «'+(current().name||'Новый макрос')+'» выполнен')},650)};
$('add').onclick=()=>{if(macros.length>=20){toast('В макете допускается 20 элементов');return}macros.push({name:'Новый макрос',key:[],kind:'url',target:'',enabled:true,icon:'globe'});selected=macros.length-1;render(true);$('name').focus();$('name').select()};
$('delete').onclick=()=>{if(macros.length===1){toast('Оставьте хотя бы один макрос в демонстрации');return}macros.splice(selected,1);selected=Math.min(selected,macros.length-1);render(true);toast('Макрос удалён из макета')};
$('pause').onclick=()=>{paused=!paused;document.querySelector('.app').classList.toggle('paused',paused);$('status').textContent=paused?'Макросы приостановлены':'Макросы активны';$('pause').setAttribute('aria-label',paused?'Возобновить макросы':'Приостановить макросы');refreshHint()};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({prototype:'Dragon Macros Motion',macros},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='dragon-macros-design-demo.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Демонстрационный конфиг сохранён')};
$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;if(f.size>100000)throw Error();const data=JSON.parse(await f.text());if(data.prototype!=='Dragon Macros Motion'||!Array.isArray(data.macros)||!data.macros.length||data.macros.length>20)throw Error();for(const m of data.macros)if(typeof m.name!=='string'||typeof m.target!=='string'||!['app','url'].includes(m.kind)||!Array.isArray(m.key)||!m.key.every(k=>typeof k==='string')||typeof m.enabled!=='boolean'||!['globe','mail','terminal','link'].includes(m.icon))throw Error();macros=data.macros;selected=0;render(true);toast('Демонстрационный конфиг загружен')}catch{toast('Выберите JSON, сохранённый из этого макета')}finally{e.target.value=''}};
$('motion').onclick=()=>{const off=document.body.classList.toggle('no-motion');$('motion').textContent=off?'Анимация выключена':'Анимация включена';$('motion').setAttribute('aria-pressed',!off)};
$('replay').onclick=()=>{const app=document.querySelector('.app');const animations=app.getAnimations({subtree:true});animations.forEach(a=>{a.cancel();a.play()})};
render();
</script>
</body></html>
